name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: Install dependencies
        working-directory: volatility/btc-perp-HF_mean-reversion/production-level
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show environment
        working-directory: volatility/btc-perp-HF_mean-reversion/production-level
        run: |
          python -c "import numpy, scipy; print('numpy', numpy.__version__, 'scipy', scipy.__version__)"
          python -c "import numba; print('numba', numba.__version__)" || echo "numba unavailable — filter falls back to pure Python"

      - name: Run tests
        working-directory: volatility/btc-perp-HF_mean-reversion/production-level
        run: pytest -v --durations=10