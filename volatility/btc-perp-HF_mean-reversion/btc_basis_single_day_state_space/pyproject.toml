[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-basis-causal-research"
version = "0.2.0"
description = "Single-day causal state-space research workbench for the BTC spot-perpetual basis"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Ugur" }]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "numba>=0.58",
]

[project.optional-dependencies]
notebook = [
  "ipython>=8.0",
  "jupyterlab>=4.0",
]
dev = [
  "pytest>=7.4",
  "pytest-cov>=5.0",
]

[tool.setuptools]
py-modules = [
  "research_backtest",
  "research_baselines",
  "research_data",
  "research_validation",
  "state_space",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --cov=state_space --cov=research_backtest --cov=research_validation --cov=research_baselines --cov=research_data --cov-report=term-missing --cov-fail-under=80"
testpaths = ["."]
python_files = ["test_*.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
